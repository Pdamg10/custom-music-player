name: Validate small playlist

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile changed Python modules
        run: python -m py_compile ui/small_playlist.py ui/unified_mode_menu.py ui/player_widget.py audio_engine.py main.py
