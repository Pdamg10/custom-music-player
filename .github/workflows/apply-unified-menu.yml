name: Apply unified view menu

on:
  push:
    branches:
      - feat/unified-view-menu

permissions:
  contents: write

jobs:
  diagnose-and-apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnose source markers
        run: |
          {
            echo 'PLAYER markers:'
            grep -n -E 'Botones de Selección|btn_norm_mode|btn_comp_mode|btn_close|norm_btns|comp_btns|_update_mode_buttons_styles' ui/player_widget.py || true
            echo 'EXPANDED markers:'
            grep -n -E 'Control Segmentado|btn_mode_normal|btn_mode_compact|btn_mode_expanded|btn_settings|_highlight_nav_button' ui/expanded_view.py || true
          } > MIGRATION_DIAGNOSTIC.txt

      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MIGRATION_DIAGNOSTIC.txt
          git commit -m "chore: diagnose unified menu source markers"
          git push
