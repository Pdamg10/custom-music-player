name: Apply unified view menu

on:
  push:
    branches:
      - feat/unified-view-menu

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply migration
        run: python tools/apply_unified_view_menu.py

      - name: Validate Python syntax
        run: python -m py_compile ui/player_widget.py ui/expanded_view.py main.py

      - name: Remove migration tooling
        run: rm -f tools/apply_unified_view_menu.py .github/workflows/apply-unified-menu.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/player_widget.py ui/expanded_view.py tools/apply_unified_view_menu.py .github/workflows/apply-unified-menu.yml
          git commit -m "feat(ui): unify view mode controls into one menu"
          git push
