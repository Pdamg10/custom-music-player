name: Validate current main

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message != 'chore: remove temporary validation workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python sources
        run: python -m py_compile main.py ui/player_widget.py ui/expanded_view.py ui/unified_mode_menu.py
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/validate-current-main.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate-current-main.yml
          git commit -m "chore: remove temporary validation workflow"
          git push
