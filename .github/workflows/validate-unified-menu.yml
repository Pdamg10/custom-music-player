name: Validate unified menu

on:
  push:
    branches:
      - feat/unified-view-menu

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile changed Python files
        run: python -m py_compile main.py ui/player_widget.py ui/expanded_view.py ui/unified_mode_menu.py
      - name: Remove temporary validation workflow
        run: rm -f .github/workflows/validate-unified-menu.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate-unified-menu.yml
          git commit -m "chore: remove temporary validation workflow"
          git push
